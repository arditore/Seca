# Robolectric's Android-36 sandbox requires JDK 21, while AGP 9.4 pins this
# project to JDK 17 exactly. Pinning sdk=34 (this project's minSdk) keeps the
# sandbox on a JDK-17-compatible Robolectric API level. This means unit tests
# under this module exercise API 34 behaviour while the app targets 36 — a
# deliberate, deferred trade-off, not an oversight.
sdk=34

# CatalogScreen is a single scrollable column of every component in the design
# system, and is specifically meant to be judged on the target Pixel 9. Without
# a qualifier, Robolectric's default virtual screen is far shorter than that
# device, so content past the fold (the empty-state sample) is clipped by the
# verticalScroll container and Compose UI test's assertIsDisplayed() correctly
# reports it as not displayed — no scroll is performed in the test. Matching
# the qualifiers to the real Pixel 9 (1080x2424 px, 420dpi -> ~411x923dp) makes
# the test viewport reflect the actual device instead of an arbitrary default.
qualifiers=w411dp-h923dp-420dpi
