# libsignal is compiled from its own sources here, for the two ABIs Seca Messages ships.
# It needs the Rust toolchain libsignal pins (rust-toolchain: 1.98.1) and an NDK.
# This recipe is written from libsignal 0.102.2's own build scripts; expect to tune it with
# the F-Droid maintainers on the merge request, which is what that review is for.
Categories:
  - Phone & SMS
License: AGPL-3.0-or-later
AuthorName: arditore
AuthorEmail: arditore@tuta.io
SourceCode: https://github.com/arditore/Seca
IssueTracker: https://github.com/arditore/Seca/issues
Changelog: https://github.com/arditore/Seca/releases

RepoType: git
Repo: https://github.com/arditore/Seca.git

Builds:
  - versionName: 0.1.0-beta3
    versionCode: 3
    commit: v0.1.0-beta3
    subdir: apps/messages
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends build-essential curl unzip
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.98.1
      - chown -R vagrant:vagrant /opt/rustup || true
    srclibs:
      - libsignal@v0.102.2
    ndk:
      - 28.0.13004108
    prebuild:
      - . "$HOME/.cargo/env"
      - rustup target add aarch64-linux-android armv7-linux-androideabi
      - ANDROID_NDK_HOME=$$NDK$$ $$libsignal$$/java/build_jni.sh android-aarch64
      - ANDROID_NDK_HOME=$$NDK$$ $$libsignal$$/java/build_jni.sh android-arm
      - cd $$libsignal$$/java && ./gradlew --no-daemon :android:publishToMavenLocal
    gradle:
      - yes
    gradleprops:
      - seca.libsignal.repo=mavenLocal
      - seca.ndkVersion=28.0.13004108

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 0.1.0-beta3
CurrentVersionCode: 3
