Categories:
  - Phone & SMS
License: AGPL-3.0-or-later
AuthorName: arditore
AuthorEmail: arditore@tuta.io
SourceCode: https://github.com/arditore/Seca
IssueTracker: https://github.com/arditore/Seca/issues
Changelog: https://github.com/arditore/Seca/releases

RepoType: git
Repo: https://github.com/arditore/Seca.git

Builds:
  - versionName: 0.1.0-beta3
    versionCode: 3
    commit: v0.1.0-beta3
    subdir: apps/messages
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends build-essential curl unzip protobuf-compiler
        libprotobuf-dev cmake ninja-build clang libclang-dev pkg-config
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile
        minimal --default-toolchain 1.98.1
      - chown -R vagrant:vagrant /opt/rustup || true
    gradle:
      - yes
    srclibs:
      - libsignal@v0.102.2
    prebuild:
      - . "$HOME/.cargo/env"
      - rustup target add aarch64-linux-android armv7-linux-androideabi
      - ANDROID_NDK_HOME=$$NDK$$ $$libsignal$$/java/build_jni.sh android-aarch64
      - ANDROID_NDK_HOME=$$NDK$$ $$libsignal$$/java/build_jni.sh android-arm
      - cd $$libsignal$$/java && ./gradlew --no-daemon :android:publishToMavenLocal
    ndk: 28.0.13004108
    gradleprops:
      - seca.libsignal.repo=mavenLocal
      - seca.ndkVersion=28.0.13004108

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 0.1.0-beta3
CurrentVersionCode: 3
