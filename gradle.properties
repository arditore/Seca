org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# Where libsignal comes from. Signal publishes it on a repository of its own; a build that
# compiles libsignal from source instead, as F-Droid does, overrides this with the folder it
# published into, or with mavenLocal. Only the org.signal group is ever taken from it.
seca.libsignal.repo=https://build-artifacts.signal.org/libraries/maven/
